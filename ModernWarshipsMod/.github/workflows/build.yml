name: Build Modern Warships Mod

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b

      - name: Build native library
        run: |
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=app/src/main/cpp

      - name: Prepare zip package
        run: |
          mkdir -p module_package/zygisk/arm64-v8a
          cp app/src/main/cpp/libs/arm64-v8a/libmw_mod.so module_package/zygisk/arm64-v8a/
          cp module/module.prop module_package/
          cp module/customize.sh module_package/
          cd module_package
          zip -r ../ModernWarships_ImGui_Menu.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModernWarships-Mod-Menu
          path: ModernWarships_ImGui_Menu.zip
